<!-- Text Colors -->
<p class="text-red-500">Red text</p>
<p class="text-blue-700">Blue text</p>
<p class="text-green-600">Green text</p>
<p class="text-purple-400">Purple text</p>

<!-- Background Gradients -->
<div class="bg-gradient-to-r from-purple-400 to-pink-600 p-6 text-white">Gradient block</div>
<div class="bg-gradient-to-br from-green-400 via-blue-500 to-purple-600 p-6 text-white">Mesh gradient block</div>
<div class="bg-gradient-to-tr from-yellow-300 via-red-500 to-pink-700 p-6 text-white">Multi-stop gradient</div>

<!-- Opacity -->
<div class="bg-blue-500 bg-opacity-50 text-opacity-75 p-4">Semi-transparent background</div>

<!-- Shadows -->
<div class="shadow">Default shadow</div>
<div class="shadow-lg">Large shadow</div>
<div class="shadow-inner">Inner shadow</div>
<div class="shadow-2xl">Extra large shadow</div>

<!-- Filters -->
<img class="blur-sm brightness-125 contrast-200" src="image.jpg" alt="Filtered image">
<img class="grayscale hover:grayscale-0" src="image.jpg" alt="Grayscale hover">

<!-- Transitions & Animations -->
<button class="transition duration-500 ease-in-out transform hover:scale-110">Hover scale</button>
<div class="animate-bounce">Bouncing element</div>
<div class="animate-spin">Spinning element</div>
<div class="animate-pulse">Pulsing element</div>
<div class="animate-ping">Ping animation</div>
