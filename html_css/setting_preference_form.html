<!-- Notification Preferences -->
<form class="max-w-lg mx-auto bg-white shadow rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Notification Settings</h2>
  <label class="flex items-center space-x-2">
    <input type="checkbox" class="form-checkbox text-blue-600">
    <span>Email Notifications</span>
  </label>
  <label class="flex items-center space-x-2">
    <input type="checkbox" class="form-checkbox text-green-600">
    <span>SMS Alerts</span>
  </label>
  <label class="flex items-center space-x-2">
    <input type="checkbox" class="form-checkbox text-purple-600">
    <span>Push Notifications</span>
  </label>
  <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Save Settings</button>
</form>

<!-- Language & Theme Preferences -->
<form class="max-w-lg mx-auto bg-gray-50 shadow-md rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Preferences</h2>
  <label class="block text-sm font-medium text-gray-700">Language</label>
  <select class="w-full border rounded px-3 py-2 focus:ring focus:border-pink-500">
    <option>English</option>
    <option>Bangla</option>
    <option>Hindi</option>
  </select>
  <label class="block text-sm font-medium text-gray-700">Theme</label>
  <select class="w-full border rounded px-3 py-2 focus:ring focus:border-pink-500">
    <option>Light</option>
    <option>Dark</option>
    <option>System Default</option>
  </select>
  <button class="w-full bg-pink-500 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded">Apply Preferences</button>
</form>
