<!-- Step Indicator -->
<div class="flex items-center justify-center space-x-4 mb-8">
  <div class="flex items-center">
    <div class="w-8 h-8 flex items-center justify-center rounded-full bg-blue-600 text-white">1</div>
    <span class="ml-2 text-blue-600 font-bold">Personal Info</span>
  </div>
  <div class="w-12 h-0.5 bg-gray-300"></div>
  <div class="flex items-center">
    <div class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-300 text-gray-600">2</div>
    <span class="ml-2 text-gray-600">Address</span>
  </div>
  <div class="w-12 h-0.5 bg-gray-300"></div>
  <div class="flex items-center">
    <div class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-300 text-gray-600">3</div>
    <span class="ml-2 text-gray-600">Payment</span>
  </div>
</div>

<!-- Step 1: Personal Info -->
<form class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-8 space-y-6">
  <fieldset class="border border-gray-300 rounded p-6">
    <legend class="text-lg font-bold text-gray-700">Step 1: Personal Information</legend>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">First Name</label>
        <input type="text" placeholder="John" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Last Name</label>
        <input type="text" placeholder="Doe" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" placeholder="john@example.com" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
      </div>
    </div>
  </fieldset>
  <div class="flex justify-end">
    <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">Next</button>
  </div>
</form>

<!-- Step 2: Address -->
<form class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-8 space-y-6">
  <fieldset class="border border-gray-300 rounded p-6">
    <legend class="text-lg font-bold text-gray-700">Step 2: Address</legend>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Street Address</label>
        <input type="text" placeholder="123 Main St" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">City</label>
        <input type="text" placeholder="Dhaka" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">State</label>
        <input type="text" placeholder="Dhaka Division" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Zip Code</label>
        <input type="text" placeholder="1207" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
      </div>
    </div>
  </fieldset>
  <div class="flex justify-between">
    <button class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded">Back</button>
    <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">Next</button>
  </div>
</form>

<!-- Step 3: Payment -->
<form class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-8 space-y-6">
  <fieldset class="border border-gray-300 rounded p-6">
    <legend class="text-lg font-bold text-gray-700">Step 3: Payment</legend>
    <div class="space-y-4 mt-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Card Number</label>
        <input type="text" placeholder="1234 5678 9012 3456" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Expiry Date</label>
          <input type="text" placeholder="MM/YY" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">CVV</label>
          <input type="text" placeholder="123" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
        </div>
      </div>
    </div>
  </fieldset>
  <div class="flex justify-between">
    <button class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded">Back</button>
    <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded">Confirm</button>
  </div>
</form>
