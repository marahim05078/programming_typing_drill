<!-- feedback.html -->
<div class="max-w-lg mx-auto bg-white shadow-lg rounded-lg p-8 space-y-6">
  <h2 class="text-2xl font-bold text-center text-gray-800">Send Feedback</h2>
  <form id="feedbackForm" class="space-y-4">
    <input type="text" name="name" placeholder="Your Name"
      class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-500" required>
    <input type="email" name="email" placeholder="Your Email"
      class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-500" required>
    <textarea name="message" placeholder="Your Feedback"
      class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-500" rows="5" required></textarea>
    <button type="submit"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
      Submit Feedback
    </button>
  </form>
  <p id="feedbackResponse" class="text-center mt-4 text-sm text-green-600 hidden">Feedback sent!</p>
</div>

<script>
document.getElementById("feedbackForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const formData = {
    name: e.target.name.value,
    email: e.target.email.value,
    message: e.target.message.value
  };
  const res = await fetch("/feedback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(formData)
  });
  const data = await res.json();
  const responseEl = document.getElementById("feedbackResponse");
  responseEl.textContent = data.message;
  responseEl.classList.remove("hidden");
});
</script>
