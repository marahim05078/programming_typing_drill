<!-- Basic Contact Form -->
<form class="max-w-lg mx-auto bg-white shadow rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Contact Us</h2>
  <input type="text" placeholder="Full Name" class="w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
  <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
  <textarea placeholder="Message" class="w-full border rounded px-3 py-2 focus:ring focus:border-green-500"></textarea>
  <button class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Send Message</button>
</form>

<!-- Contact with Phone -->
<form class="max-w-lg mx-auto bg-gray-50 shadow-md rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Contact Form</h2>
  <input type="text" placeholder="Full Name" class="w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
  <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
  <input type="tel" placeholder="Phone Number" class="w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
  <textarea placeholder="Message" class="w-full border rounded px-3 py-2 focus:ring focus:border-purple-500"></textarea>
  <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded">Submit</button>
</form>
