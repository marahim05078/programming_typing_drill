<!-- Basic Register -->
<form class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-6 space-y-4">
  <h2 class="text-2xl font-bold text-center">Register</h2>
  <input type="text" placeholder="Username" class="w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
  <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
  <input type="password" placeholder="Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
  <input type="password" placeholder="Confirm Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
  <button class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Register</button>
</form>

<!-- Register with Terms -->
<form class="max-w-md mx-auto bg-gray-50 shadow-md rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Register</h2>
  <input type="text" placeholder="Username" class="w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
  <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
  <input type="password" placeholder="Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
  <input type="password" placeholder="Confirm Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
  <label class="flex items-center space-x-2">
    <input type="checkbox" class="form-checkbox text-purple-600">
    <span>I agree to the Terms & Conditions</span>
  </label>
  <button class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded">Register</button>
</form>

<!-- Register with Profile Info -->
<form class="max-w-md mx-auto bg-white shadow rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Register</h2>
  <input type="text" placeholder="Full Name" class="w-full border rounded px-3 py-2 focus:ring focus:border-pink-500">
  <input type="text" placeholder="Username" class="w-full border rounded px-3 py-2 focus:ring focus:border-pink-500">
  <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2 focus:ring focus:border-pink-500">
  <input type="password" placeholder="Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-pink-500">
  <input type="password" placeholder="Confirm Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-pink-500">
  <button class="w-full bg-pink-500 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded">Register</button>
</form>
