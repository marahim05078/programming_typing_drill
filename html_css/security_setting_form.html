<!-- Change Password -->
<form class="max-w-lg mx-auto bg-white shadow rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Change Password</h2>
  <input type="password" placeholder="Current Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-red-500">
  <input type="password" placeholder="New Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-red-500">
  <input type="password" placeholder="Confirm New Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-red-500">
  <button class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Update Password</button>
</form>

<!-- Two-Factor Authentication -->
<form class="max-w-lg mx-auto bg-gray-50 shadow-md rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Two-Factor Authentication</h2>
  <p class="text-gray-600">Enable 2FA for extra security.</p>
  <label class="flex items-center space-x-2">
    <input type="checkbox" class="form-checkbox text-indigo-600">
    <span>Enable 2FA via SMS</span>
  </label>
  <label class="flex items-center space-x-2">
    <input type="checkbox" class="form-checkbox text-indigo-600">
    <span>Enable 2FA via Email</span>
  </label>
  <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">Save Security Settings</button>
</form>
