<!-- Basic Address Form -->
<form class="max-w-lg mx-auto bg-white shadow-lg rounded-lg p-6 space-y-4">
  <h2 class="text-2xl font-bold text-center">Address</h2>
  <input type="text" placeholder="Street Address" class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
  <div class="grid grid-cols-2 gap-4">
    <input type="text" placeholder="City" class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
    <input type="text" placeholder="State" class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
  </div>
  <input type="text" placeholder="Zip Code" class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
  <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Save Address</button>
</form>

<!-- Address with Country Dropdown -->
<form class="max-w-lg mx-auto bg-gray-50 shadow-md rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Shipping Address</h2>
  <input type="text" placeholder="Street Address" class="w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
  <div class="grid grid-cols-2 gap-4">
    <input type="text" placeholder="City" class="w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
    <input type="text" placeholder="State" class="w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
  </div>
  <input type="text" placeholder="Zip Code" class="w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
  <select class="w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
    <option>Bangladesh</option>
    <option>India</option>
    <option>USA</option>
    <option>UK</option>
  </select>
  <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">Continue</button>
</form>
