<!-- Basic Profile Form -->
<form class="max-w-2xl mx-auto bg-white shadow-lg rounded-lg p-8 space-y-6">
  <h2 class="text-2xl font-bold text-center">Profile Information</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
      <label class="block text-sm font-medium text-gray-700">Full Name</label>
      <input type="text" placeholder="John Doe" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Username</label>
      <input type="text" placeholder="johndoe" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" placeholder="john@example.com" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm font-medium text-gray-700">Phone Number</label>
      <input type="tel" placeholder="+880123456789" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
    </div>
  </div>
</form>

<!-- Profile with Avatar Upload -->
<form class="max-w-2xl mx-auto bg-gray-50 shadow-md rounded-lg p-8 space-y-6">
  <h2 class="text-xl font-bold text-center">Edit Profile</h2>
  <div class="flex items-center space-x-4">
    <img src="avatar.jpg" class="w-20 h-20 rounded-full">
    <input type="file" class="border rounded px-3 py-2 focus:ring focus:border-indigo-500">
  </div>
  <input type="text" placeholder="Full Name" class="w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
  <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
  <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">Update Profile</button>
</form>
