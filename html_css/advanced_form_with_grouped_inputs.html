<!-- Personal Information Group -->
<form class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-8 space-y-8">
  <fieldset class="border border-gray-300 rounded p-6">
    <legend class="text-lg font-bold text-gray-700">Personal Information</legend>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">First Name</label>
        <input type="text" placeholder="John" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Last Name</label>
        <input type="text" placeholder="Doe" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" placeholder="john@example.com" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
      </div>
    </div>
  </fieldset>

  <!-- Address Group -->
  <fieldset class="border border-gray-300 rounded p-6">
    <legend class="text-lg font-bold text-gray-700">Address</legend>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Street Address</label>
        <input type="text" placeholder="123 Main St" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">City</label>
        <input type="text" placeholder="Dhaka" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">State</label>
        <input type="text" placeholder="Dhaka Division" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Zip Code</label>
        <input type="text" placeholder="1207" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-purple-500">
      </div>
    </div>
  </fieldset>

  <!-- Account Settings Group -->
  <fieldset class="border border-gray-300 rounded p-6">
    <legend class="text-lg font-bold text-gray-700">Account Settings</legend>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" placeholder="johndoe" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" placeholder="••••••••" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input type="password" placeholder="••••••••" class="mt-1 block w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
      </div>
    </div>
  </fieldset>

  <!-- Preferences Group -->
  <fieldset class="border border-gray-300 rounded p-6">
    <legend class="text-lg font-bold text-gray-700">Preferences</legend>
    <div class="space-y-4 mt-4">
      <label class="flex items-center space-x-2">
        <input type="checkbox" class="form-checkbox text-blue-600">
        <span>Subscribe to newsletter</span>
      </label>
      <label class="flex items-center space-x-2">
        <input type="checkbox" class="form-checkbox text-green-600">
        <span>Enable notifications</span>
      </label>
      <label class="flex items-center space-x-2">
        <input type="checkbox" class="form-checkbox text-purple-600">
        <span>Accept terms & conditions</span>
      </label>
    </div>
  </fieldset>

  <!-- Submit -->
  <div class="text-center">
    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">
      Submit Form
    </button>
  </div>
</form>
