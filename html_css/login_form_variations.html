<!-- Basic Login -->
<form class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-6 space-y-4">
  <h2 class="text-2xl font-bold text-center">Login</h2>
  <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
  <input type="password" placeholder="Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-blue-500">
  <button class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Login</button>
</form>

<!-- Login with Remember Me -->
<form class="max-w-md mx-auto bg-gray-50 shadow-md rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Login</h2>
  <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
  <input type="password" placeholder="Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-indigo-500">
  <div class="flex items-center justify-between">
    <label class="flex items-center space-x-2">
      <input type="checkbox" class="form-checkbox text-blue-600">
      <span>Remember Me</span>
    </label>
    <a href="#" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
  </div>
  <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">Login</button>
</form>

<!-- Login with Social Buttons -->
<form class="max-w-md mx-auto bg-white shadow rounded-lg p-6 space-y-4">
  <h2 class="text-xl font-bold text-center">Login</h2>
  <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
  <input type="password" placeholder="Password" class="w-full border rounded px-3 py-2 focus:ring focus:border-green-500">
  <button class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Login</button>
  <div class="flex space-x-4 mt-4">
    <button class="flex-1 bg-blue-600 text-white py-2 rounded">Facebook</button>
    <button class="flex-1 bg-red-600 text-white py-2 rounded">Google</button>
  </div>
</form>
