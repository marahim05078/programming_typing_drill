name: Enterprise CI/CD
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with: { node-version: "18" }
      - run: npm install
      - run: npm test
      - run: npm run build
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/k8s-deploy@v1
        with:
          manifests: |
            kubernetes-deployment.yaml
            kubernetes-service.yaml
