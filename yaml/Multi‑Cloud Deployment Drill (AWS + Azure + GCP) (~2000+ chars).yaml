# AWS EKS deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-aws
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: my-backend:aws
          ports: [{ containerPort: 5000 }]

