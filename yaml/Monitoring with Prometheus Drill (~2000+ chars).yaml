# prometheus.yaml
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway-service:8000"]
  - job_name: "user-service"
    static_configs:
      - targets: ["user-service:6000"]
  - job_name: "product-service"
    static_configs:
      - targets: ["product-service:7000"]
